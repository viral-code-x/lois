<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOIS Web Interpreter</title>

<style>
body {
    font-family: monospace;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    background: #fafafa;
}

h1 {
    margin-bottom: 4px;
}

.subtitle {
    margin-top: 0;
    color: #555;
}

textarea {
    width: 100%;
    min-height: 300px;
    box-sizing: border-box;
    padding: 14px;
    font: 15px monospace;
    border: 1px solid #aaa;
    border-radius: 4px;
    resize: vertical;
}

button {
    margin: 12px 0 20px;
    padding: 9px 18px;
    font: bold 14px monospace;
    cursor: pointer;
}

pre {
    background: #111;
    color: #eee;
    padding: 14px;
    min-height: 100px;
    white-space: pre-wrap;
    border-radius: 4px;
}

.code {
    color: #1464a0;
}

.keyword {
    color: #7b2cbf;
    font-weight: bold;
}

.number {
    color: #a33;
}

.string {
    color: #087f5b;
}
</style>
</head>

<body>

<h1>LOIS : Language Operated on IS</h1>
<p class="subtitle">LOIS Web Interpreter</p>

<label><b>LOIS CODE</b></label>

<textarea id="code">name is Alex
age is 19

output is hello name

if age > 18
then output is "adult"</textarea>

<br>

<button onclick="runLOIS()">[ RUN LOIS ]</button>

<h3>OUTPUT</h3>
<pre id="output"></pre>

<script>
function runLOIS() {
    const code = document.getElementById("code").value;
    const output = document.getElementById("output");

    const variables = {};
    const lines = code.split(/\r?\n/);
    const result = [];

    function isNumber(value) {
        return /^-?(?:\d+(?:\.\d*)?|\.\d+)$/.test(value);
    }

    function valueOf(name) {
        if (Object.prototype.hasOwnProperty.call(variables, name)) {
            return variables[name];
        }

        return name;
    }

    function tokenize(text) {
        return text.match(
            /"[^"]*"|'[^']*'|>=|<=|==|!=|[()+\-*/%^<>]|[A-Za-z_][A-Za-z0-9_]*|\d+(?:\.\d+)?|\S/g
        ) || [];
    }

    function replaceVariables(text) {
        return text.replace(
            /\b[A-Za-z_][A-Za-z0-9_]*\b/g,
            word => {
                if (
                    word === "and" ||
                    word === "or" ||
                    word === "not" ||
                    word === "True" ||
                    word === "False"
                ) {
                    return word;
                }

                return Object.prototype.hasOwnProperty.call(variables, word)
                    ? JSON.stringify(variables[word])
                    : word;
            }
        );
    }

    function evaluateExpression(expr) {
        expr = expr.trim();

        if (expr.startsWith('"') && expr.endsWith('"')) {
            return expr.slice(1, -1);
        }

        if (expr.startsWith("'") && expr.endsWith("'")) {
            return expr.slice(1, -1);
        }

        if (Object.prototype.hasOwnProperty.call(variables, expr)) {
            return variables[expr];
        }

        if (expr === "True") return true;
        if (expr === "False") return false;

        if (isNumber(expr)) {
            return Number(expr);
        }

        let js = replaceVariables(expr);

        js = js
            .replace(/\bTrue\b/g, "true")
            .replace(/\bFalse\b/g, "false")
            .replace(/\bnot\b/g, "!")
            .replace(/\band\b/g, "&&")
            .replace(/\bor\b/g, "||")
            .replace(/\^/g, "**");

        try {
            return Function('"use strict"; return (' + js + ')')();
        } catch {
            return expr
                .split(/\s+/)
                .map(part => valueOf(part))
                .join(" ");
        }
    }

    function outputExpression(expr) {
        expr = expr.trim();

        if (expr.startsWith('"') && expr.endsWith('"')) {
            result.push(expr.slice(1, -1));
            return;
        }

        if (expr.startsWith("'") && expr.endsWith("'")) {
            result.push(expr.slice(1, -1));
            return;
        }

        const value = evaluateExpression(expr);

        if (typeof value === "boolean") {
            result.push(value ? "True" : "False");
        } else {
            result.push(String(value));
        }
    }

    function evaluateCondition(condition) {
        return Boolean(evaluateExpression(condition));
    }

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        if (!line) continue;

        /*
         * THEN line:
         *
         * if age > 18
         * then output is "adult"
         */
        if (line.startsWith("if ")) {
            const condition = line.slice(3).trim();

            const next = lines[i + 1]
                ? lines[i + 1].trim()
                : "";

            if (!next.startsWith("then ")) {
                result.push(
                    "LOIS: expected 'then' after if condition"
                );
                continue;
            }

            i++;

            if (evaluateCondition(condition)) {
                const action = next.slice(5).trim();

                if (action.startsWith("output is ")) {
                    outputExpression(
                        action.slice(10)
                    );
                }
            }

            continue;
        }

        /*
         * Input.
         */
        if (line.startsWith("input ")) {
            let rest = line.slice(6).trim();

            if (rest.startsWith("is ")) {
                rest = rest.slice(3).trim();
            }

            const name = rest;

            const value = prompt(
                "LOIS input: " + name
            );

            if (value === null) {
                variables[name] = "";
            } else if (isNumber(value)) {
                variables[name] = Number(value);
            } else {
                variables[name] = value;
            }

            continue;
        }

        /*
         * Output.
         */
        if (line.startsWith("output is ")) {
            outputExpression(
                line.slice(10)
            );

            continue;
        }

        /*
         * Assignment using IS.
         */
        const isMatch = line.match(
            /^([A-Za-z_][A-Za-z0-9_]*)\s+is\s+(.+)$/
        );

        if (isMatch) {
            const name = isMatch[1];
            const expression = isMatch[2];

            variables[name] =
                evaluateExpression(expression);

            continue;
        }

        /*
         * Assignment using =.
         */
        const equalMatch = line.match(
            /^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/
        );

        if (equalMatch) {
            const name = equalMatch[1];
            const expression = equalMatch[2];

            variables[name] =
                evaluateExpression(expression);

            continue;
        }

        result.push(
            "LOIS: unknown statement on line " +
            (i + 1)
        );
    }

    output.textContent = result.join("\n");
}
</script>

</body>
</html>
