<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOIS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #eee;
            font-family: monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 60px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        button {
            background: #eee;
            color: #000;
            border: 0;
            padding: 10px 20px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
        }

        textarea {
            flex: 1;
            width: 100%;
            resize: none;
            background: #111;
            color: #eee;
            border: 1px solid #333;
            padding: 20px;
            font: 16px monospace;
            outline: none;
        }

        #output {
            height: 180px;
            background: #050505;
            border: 1px solid #333;
            padding: 20px;
            white-space: pre-wrap;
            overflow: auto;
        }

        .label {
            color: #777;
            margin-bottom: -8px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">LOIS</div>
    <button onclick="runLOIS()">RUN ▶</button>
</header>

<main>

    <div class="label">CODE</div>

    <textarea id="code">x is 10
output is x * 5</textarea>

    <div class="label">OUTPUT</div>

    <div id="output"></div>

</main>

<script>
let ModuleReady;

var Module = {
    onRuntimeInitialized() {
        ModuleReady = true;
    }
};

function runLOIS() {
    if (!ModuleReady) {
        document.getElementById("output").textContent =
            "LOIS engine is still loading...";
        return;
    }

    const source =
        document.getElementById("code").value;

    const length =
        Module.lengthBytesUTF8(source) + 1;

    const ptr =
        Module._malloc(length);

    Module.stringToUTF8(
        source,
        ptr,
        length
    );

    const result =
        Module.ccall(
            "lois_run_source",
            "string",
            ["number"],
            [ptr]
        );

    Module._free(ptr);

    document.getElementById("output").textContent =
        result;
}
</script>

<script src="lois.js"></script>

</body>
</html>
