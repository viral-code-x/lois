<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOIS Interpreter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <a class="logo" href="index.html">LOIS</a>

    <div class="nav-links">
        <a href="interpreter.html">Interpreter</a>
        <a href="tutorial.html">Tutorial</a>
        <a href="reviews.html">Reviews</a>
    </div>
</nav>

<main class="interpreter-page">
    <div class="page-heading">
        <h1>LOIS Interpreter</h1>
        <p>Write LOIS code and run it directly in your browser.</p>
    </div>

    <section class="interpreter">

        <!-- CODE -->
        <div class="panel">
            <div class="panel-header">
                <span>CODE</span>
                <button id="run" disabled>Run</button>
            </div>

            <textarea id="code" spellcheck="false">name is "LOIS"
output is name</textarea>
        </div>

        <!-- TERMINAL -->
        <div class="panel terminal-panel">
            <div class="panel-header">
                <span>TERMINAL</span>
            </div>

            <div id="terminal" class="terminal">
                <pre id="output"></pre>

                <div id="input-area" hidden>
                    <span id="terminal-prompt">&gt;</span>

                    <input
                        id="console-input"
                        type="text"
                        autocomplete="off"
                        spellcheck="false"
                        placeholder=""
                    >
                </div>
            </div>
        </div>

    </section>
</main>

<script src="lois.js"></script>
<script src="interpreter.js"></script>

</body>
</html>
