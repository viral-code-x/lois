<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOIS — Reviews</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <a class="logo" href="index.html">LOIS</a>

    <div class="nav-links">
        <a href="interpreter.html">Interpreter</a>
        <a href="tutorial.html">Tutorial</a>
        <a href="reviews.html">Reviews</a>
    </div>
</nav>

<main class="hero">
    <h1>Reviews</h1>

    <p class="tagline">
        Tell us what you think about LOIS.
    </p>

    <form id="review-form">
        <textarea
            id="review"
            maxlength="1000"
            placeholder="Write your review..."
            required
        ></textarea>

        <button type="submit" class="button" id="submit-review">
            Submit Review
        </button>

        <p id="review-status"></p>
    </form>

    <div id="reviews">
        <p>Loading reviews...</p>
    </div>
</main>

<script src="reviews.js"></script>

</body>
</html>
